<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bichos del Santuario</title>
<style>
  body { margin: 0; background: #1c1d2b; color: #fff; font-family: system-ui, sans-serif; }
  header { padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; background: #1c1d2bee; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  header label { font-size: 14px; display: flex; gap: 8px; align-items: center; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 0 16px 24px; }
  .card { background: #2a2c40; border-radius: 14px; overflow: hidden; }
  .card canvas { width: 100%; display: block; aspect-ratio: 1; }
  .card .info { padding: 8px 12px 12px; }
  .card .name { font-weight: 700; }
  .card .meta { font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<header>
  <h1>Bichos del Santuario · vista previa de los modelos</h1>
  <label>Girar <input id="giro" type="range" min="-180" max="180" value="-35"></label>
  <label><input id="adornos" type="checkbox" checked> Con adornos pequeños</label>
</header>
<div id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script>
const MODELOS = /*MODELOS*/[];
const SIZE = 520;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.outputEncoding = THREE.sRGBEncoding;

const wedgeGeometry = (() => {
  // Cuña de Roblox: altura completa en +Z y cero en -Z; prisma a lo largo de X.
  const a = [-0.5, -0.5, -0.5], b = [-0.5, -0.5, 0.5], c = [-0.5, 0.5, 0.5];
  const d = [0.5, -0.5, -0.5], e = [0.5, -0.5, 0.5], f = [0.5, 0.5, 0.5];
  const tris = [a, b, c, d, f, e, a, d, e, a, e, b, b, e, f, b, f, c, a, c, f, a, f, d];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
})();
const GEO = {
  Ball: new THREE.SphereGeometry(0.5, 28, 20),
  Ellipsoid: new THREE.SphereGeometry(0.5, 28, 20),
  Block: new THREE.BoxGeometry(1, 1, 1),
  Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 28).rotateZ(Math.PI / 2),
  Wedge: wedgeGeometry,
};
const rad = (deg) => deg * Math.PI / 180;

function buildModel(model, withFine) {
  const group = new THREE.Group();
  for (const part of model.parts) {
    if (part.name === 'Parpado' || (part.fine && !withFine)) continue;
    const color = new THREE.Color(part.color[0] / 255, part.color[1] / 255, part.color[2] / 255).convertSRGBToLinear();
    const opacity = 1 - (part.transparency || 0);
    let material;
    if (part.material === 'Neon') {
      material = new THREE.MeshBasicMaterial({ color });
    } else {
      const metal = part.material === 'Metal';
      material = new THREE.MeshStandardMaterial({
        color, side: THREE.DoubleSide,
        roughness: metal ? 0.35 : part.material === 'Glass' ? 0.1 : part.reflectance ? 0.25 : 0.7,
        metalness: metal ? 0.6 : part.reflectance ? 0.5 : 0,
        flatShading: part.material === 'Slate',
      });
    }
    const glassy = part.material === 'Glass';
    if (opacity < 1 || glassy) { material.transparent = true; material.opacity = opacity * (glassy ? 0.75 : 1); }
    const mesh = new THREE.Mesh(GEO[part.shape], material);
    const s = part.size;
    if (part.shape === 'Ball') { const d = Math.min(...s); mesh.scale.set(d, d, d); }
    else if (part.shape === 'Cylinder') { const d = Math.min(s[1], s[2]); mesh.scale.set(s[0], d, d); }
    else mesh.scale.set(s[0], s[1], s[2]);
    mesh.position.set(...part.pos);
    const r = part.rot || [0, 0, 0];
    mesh.quaternion.setFromEuler(new THREE.Euler(rad(r[0]), rad(r[1]), rad(r[2]), 'XYZ'));
    if (part.rot2) mesh.quaternion.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(part.rot2[0]), rad(part.rot2[1]), rad(part.rot2[2]), 'XYZ')));
    group.add(mesh);
  }
  // Aro de rareza en el suelo.
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.03, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color(...model.rarityColor.map((x) => x / 255)).convertSRGBToLinear(), transparent: true, opacity: 0.6 }));
  ring.position.y = -0.47;
  group.add(ring);
  return group;
}

function render(model, canvas, angle, withFine) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x343750);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(-2, 4, -3);
  scene.add(sun);
  const group = buildModel(model, withFine);
  group.rotation.y = rad(angle);
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group);
  const center = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length() / 2;
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  const distance = radius / Math.sin(rad(15)) * 1.02;
  camera.position.set(center.x, center.y + distance * 0.3, center.z - distance * 0.95);
  camera.lookAt(center);
  renderer.render(scene, camera);
  canvas.getContext('2d').drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
}

const grid = document.getElementById('grid');
const canvases = [];
for (const model of MODELOS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = model.id;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `<div class="name">${model.name}</div><div class="meta"><span style="color:rgb(${model.rarityColor})">${model.label}</span> · ${model.coins.toLocaleString('es')} 💰/s · ${model.size} studs · ${model.parts.length} piezas</div>`;
  card.append(canvas, info);
  grid.append(card);
  canvases.push([model, canvas]);
}
function drawAll() {
  const angle = Number(document.getElementById('giro').value);
  const withFine = document.getElementById('adornos').checked;
  for (const [model, canvas] of canvases) render(model, canvas, angle, withFine);
}
document.getElementById('giro').addEventListener('input', drawAll);
document.getElementById('adornos').addEventListener('change', drawAll);
window.dibujar = drawAll;
drawAll();
</script>
</body>
</html>
